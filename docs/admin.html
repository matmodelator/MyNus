 async function saveUser(uid){const changes=dirty.get(uid);if(!changes)return;const captured={...changes};if(await operation('users/'+uid,captured)){dirty.delete(uid);await load(true);if(selected===uid)await refreshAccount()}}

 function filterOptions(){
  for(const [id,first] of [['filter','Все пользователи'],['consoleFilter','Все пользователи + сервер']]){
   const select=$(id),value=select.value,existing=new Map([...select.options].filter(o=>o.value&&o.value!=='server').map(o=>[o.value,o.textContent]));

   select.replaceChildren(new Option(first,''));if(id==='consoleFilter')select.add(new Option('Только сервер','server'));for(const [uid,label] of existing)select.add(new Option(label,uid));select.value=value;
  }
  const value=$('consoleSession').value;$('consoleSession').replaceChildren(new Option('Все сессии',''));

 async function separation(parent,id){

 }
 function tokenCard(parent,token){const block=document.createElement('div');block.className='tokenCard';const label=document.createElement('div');label.textContent='№ '+token.token_id+' · '+token.type+' · '+token.status;block.append(label);copyField(block,token.token);const meta=document.createElement('div');meta.textContent='Сепарация: '+(token.separation_id??'Все сепарации аккаунта')+' · Получен: '+date(token.issued_at)+(token.expires_at?' · До: '+date(token.expires_at):'')+(token.status==='used'?' · Использован: '+date(token.closed_at):'');block.append(meta);parent.append(block)}
 function render(){
  const rows=state[tab],total=state.counts[tab];$('results').replaceChildren();for(const b of document.querySelectorAll('[data-tab]')){b.classList.toggle('selected',b.dataset.tab===tab);b.textContent=names[b.dataset.tab]+' · '+state.counts[b.dataset.tab]}
  $('subscriptions').classList.toggle('selected',tab==='subscriptions');$('subscriptions').textContent='Подписки · '+state.counts.subscriptions;$('serverCode').value=state.server_code;$('previous').disabled=offset===0;$('next').disabled=offset+200>=total;$('page').textContent=total?(offset+1)+'–'+Math.min(offset+rows.length,total)+' / '+total:'0';$('saveAll').disabled=!dirty.size||busy;
  if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='Записей нет.';$('results').append(p);return}
  const titles={users:['№','Пользователь','Имя','Доступ','Лимит','Цвет','Аккаунт','Действия'],sessions:['Пользователь','Устройство','Вход','Последняя операция','Действует до','Сепарации','Действия','Ключ входа'],separations:['Сепарация','Пользователь','Трек','Статус','Прогресс','Создана','Завершена','Файлы','Очистка не ранее'],tokens:['№','Пользователь','Токен','Тип','Статус','Сепарация','Выдан','До','Закрыт'],subscriptions:['№','Пользователь','План','Статус','Начало','До']};
  const table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr'),body=document.createElement('tbody');for(const title of titles[tab]){const th=document.createElement('th');th.textContent=title;hr.append(th)}head.append(hr);table.append(head,body);$('results').append(table);

   if(tab==='users'){
    const change=dirty.get(item.user_id)||{};cell(tr,item.user_id);userCell(tr,item);cell(tr,item.name,true);
    const select=document.createElement('select');for(const [v,t] of [['','Без доступа'],['Subscription','Subscription'],['OneTime','OneTime']])select.add(new Option(t,v));select.value=(Object.hasOwn(change,'status')?change.status:item.status)||'';select.onchange=()=>mark(item,'status',select.value||null);cell(tr,'').append(select);
    const limit=document.createElement('input');limit.type='number';limit.min=1;limit.max=100;limit.value=change.max_active_sessions??item.max_active_sessions;limit.oninput=()=>mark(item,'max_active_sessions',Number(limit.value));cell(tr,'').append(limit);
    const color=document.createElement('input');color.type='color';color.value=change.console_color||item.color;color.oninput=()=>mark(item,'console_color',color.value);const colorTd=cell(tr,'');colorTd.append(color);button(colorTd,'Auto',()=>{mark(item,'console_color',null);color.value=state.palette[(item.user_id-1)%24]});
    cell(tr,item.is_blocked?'Заблокирован':'Активен');const actions=cell(tr,'');actions.className='rowActions';button(actions,'Сохранить',()=>saveUser(item.user_id));button(actions,item.is_blocked?'Разблокировать':'Блокировать',async()=>{if(await operation('users/'+item.user_id,{is_blocked:!item.is_blocked},item.is_blocked?null:'Заблокировать аккаунт и завершить все сессии?')){await load(true);if(selected===item.user_id)await refreshAccount()}});
   }else if(tab==='sessions'){
    userCell(tr,item);cell(tr,item.device,true);cell(tr,date(item.created_at));cell(tr,date(item.last_seen_at));cell(tr,item.operation_running?'Выполняется операция':date(item.expires_at));const seps=cell(tr,'');if(!item.separations.length)seps.textContent='—';for(const sep of item.separations)separation(seps,sep.separation_id);button(cell(tr,''),'Завершить',async()=>{if(await operation('sessions/revoke',{session_id:item.session_id},'Завершить сессию?'))await load(true)});copyField(cell(tr,''),item.login_key);

 async function load(preserve=false){if(loading)return;loading=true;try{state=await api('state?'+new URLSearchParams({q:$('search').value,user_id:$('filter').value,offset}));csrf=state.csrf;filterOptions();render();recolor();$('updated').textContent='Обновлено '+mynusTime801();if(!preserve)notice(dirty.size?'Есть несохранённые изменения.':'')}catch(e){notice(e.message,true)}finally{loading=false}}
 function rightView(view){$('accountMenu').hidden=view!=='menu';$('profilePanel').hidden=view!=='profile';$('paymentsPanel').hidden=view!=='payments';$('profileEditor').hidden=true;$('accountTitle').textContent='MyNus — '+({menu:'Account',profile:'Profile',payments:'Payments'})[view]}

 async function refreshAccount(){if(!selected)return;const uid=selected;const data=await api('users/'+uid+'/account');if(selected===uid){accountData=data;renderAccount()}}
function renderLicence801(user){let field=$('appLicence801');if(!field){const label=document.createElement('label');label.textContent='Application level';field=document.createElement('select');field.id='appLicence801';for(const value of ['Basic','Advanced','Pro'])field.add(new Option(value,value));label.append(field);$('account').prepend(label);field.onchange=async()=>{field.disabled=true;try{await api('licence',{user_id:selected,level:field.value});$('accountNotice').textContent='Уровень сохранён.';}catch(e){$('accountNotice').textContent=e.message;}finally{field.disabled=false;}};}field.value=user.app_level||'Basic';}
function accessButtons820(user){let group=$('adminAccess820');if(!group){group=document.createElement('div');group.id='adminAccess820';const send=document.createElement('button'),subscription=document.createElement('button');send.textContent='Send Token';send.className='send-token820';subscription.textContent='Set Subscription';subscription.className='set-sub820';send.title='Send a OneTime token to this account.';subscription.title='Set the subscription duration for this account.';group.append(send,subscription);$('account').append(group);
