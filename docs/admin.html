<style>

x}#notice{min-height:18px;margin:0;color:#8bd5ff;font-size:13px}#notice.error{color:#ff9999}.scroll{flex:1;min-height:0;overflow:auto;border:1px solid #444;border-radius:5px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px;text-align:left;border-bottom:1px solid #444;vertical-align:top}th{position:sticky;top:0;background:#303030;color:#bbb;z-index:1}td.wrap{white-space:normal;min-width:150px;max-width:300px;overflow-wrap:anywhere}td button,td input,td select{font-size:12px}td input,td select{height:30px}td input[type=number]{width:56px}td input.key{width:128px}td input[type=color]{width:40px;padding:3px}.rowActions{display:flex;gap:4px}details{white-space:normal;min-width:230px}summary{cursor:pointer;color:#60a5fa}details div{margin:6px 0}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px}.pager button{padding:5px 9px}#updated{margin-right:auto;color:#aaa}.empty{padding:24px;color:#aaa}.hint{color:#bbb;font-size:12px}#right{overflow:auto}#accountMenu{display:grid;gap:10px}#right button{width:100%;min-height:32px}#right .section{display:grid;gap:10px}#right dl{margin:0;display:grid;gap:5px;overflow-wrap:anywhere}#right dt{font-size:12px;color:#aaa}#right dd{margin:0 0 6px}#right label{display:grid;gap:5px;color:#ccc;font-size:13px}#right input,#right select{width:100%}#right .actions{display:flex;gap:6px}#right .actions button{flex:1}#right hr{width:100%;border:0;border-top:1px solid #444}#accountTitle{margin-bottom:18px}#accountNotice{font-size:13px;color:#8bd5ff;overflow-wrap:anywhere}.tokenCard{border-top:1px solid #444;padding-top:8px;font-size:12px;overflow-wrap:anywhere}.tokenCard input{font-size:12px}#right .switch{border:0}#right .success{color:#99e1b1;background:#153d23;padding:10px;border-radius:5px;font-size:12px}@media(min-width:1700px){.layout{grid-template-columns:330px minmax(0,1fr) 340px}}
</style>
<header id="top"><h1>MyNus — Админка</h1><label>Код сервера<input id="serverCode" readonly aria-label="Код сервера"></label><span class="version">7.9.0 · Локальная админка</span></header>
<div class="layout">
 <aside id="left" class="panel"><h2>Console</h2><div class="consoleActions"><button id="consoleCopy">Copy</button><button id="consoleSave">Save .log</button><button id="consoleClear">Clear</button></div><select id="consoleFilter" aria-label="Пользователь консоли"><option value="">Все пользователи + сервер</option><option value="server">Только сервер</option></select><select id="consoleSession" aria-label="Сессия консоли"><option value="">Все сессии</option></select><select id="consoleKind" aria-label="Фильтр сообщений"><option value="all">Все сообщения</option><option value="error">Только ошибки</option><option value="separations">Только сепарации</option><option value="payments">Только оплаты</option></select><div id="consoleText" tabindex="0"></div><div id="consoleStatus">Сообщения устройств в ServerMode</div></aside>
 <main id="center" class="panel"><nav><button data-tab="users">Пользователи</button><button data-tab="sessions">Текущие сессии</button><button data-tab="separations">Сепарации</button><button data-tab="tokens">Токены</button>
<button id="subscriptions">Подписки</button></nav><div class="tools"><input id="search" type="search" placeholder="Имя или e-mail"><select id="filter" aria-label="Пользователь"><option value="">Все пользователи</option></select><button id="refresh">Обновить</button><button id="saveAll" disabled>Сохранить все</button></div><p id="notice" role="status"></p><div class="scroll" id="results"></div><div class="pager"><span id="updated"></span><button id="previous">←</button><span id="page"></span><button id="next">→</button></div></main>
 <aside id="right" class="panel"><strong id="accountTitle">MyNus — Account</strong><p id="accountEmpty" class="hint">Выберите пользователя в центральной таблице.</p><section id="account" hidden>
  <div id="accountMenu"><button id="openProfile">Profile</button><button id="openPayments">Payments</button></div>
  <section id="profilePanel" class="section" hidden><dl id="profileDetails"></dl><div class="actions"><button id="profileChange">Change</button><button class="accountBack">Back</button></div><form id="profileEditor" class="section" hidden><label>First name<input name="first_name" maxlength="120"></label><label>Last name<input name="last_name" maxlength="120"></label><label>Email<input name="email" type="email" maxlength="254" required></label><label>Phone<input name="phone" maxlength="40"></label><label>Country<input name="country" maxlength="120"></label><button>Save</button></form><button class="switch" id="profilePayments">Payments</button></section>
  <section id="paymentsPanel" class="section" hidden><p id="paymentSummary"></p><label>Тип доступа<select id="paymentType"><option>OneTime</option><option>Subscription</option></select></label><button id="confirmToken">Подтвердить оплату</button><button id="checkToken">Проверить токен</button><div id="accountTokens"></div><button disabled>Change plan</button><button disabled>Manage subscription</button><p class="success">Payment management is not connected yet. Test confirmation does not charge money.</p><hr><strong>Recent payments</strong><div id="accountPayments"></div><button class="switch" id="paymentsProfile">Profile</button><button class="accountBack">Back</button></section>
  <p id="accountNotice" role="status"></p><button id="accountLogout">Log out</button><button id="accountClose">Close</button>
 </section></aside>
</div><script>
(()=>{
 const $=id=>document.getElementById(id),dirty=new Map();let csrf='',tab='sessions',offset=0,state=null,loading=false,busy=false,selected=null,accountData=null;
 const names={users:'Пользователи',sessions:'Текущие сессии',separations:'Сепарации',tokens:'Токены',subscriptions:'Подписки'};
 const statuses={queued:'В очереди',running:'Выполняется',completed:'Завершена',failed:'Ошибка',cancelled:'Отменена'};
 const notice=(text,error=false)=>{$('notice').textContent=text;$('notice').classList.toggle('error',error)};
 async function api(path,data){
  const response=await fetch('/api/admin/'+path,{method:data===undefined?'GET':'POST',cache:'no-store',credentials:'same-origin',headers:data===undefined?{}:{'Content-Type':'application/json','X-MyNus-Admin-CSRF':csrf},body:data===undefined?undefined:JSON.stringify(data),signal:AbortSignal.timeout(15000)});
  const value=await response.json().catch(()=>({error:'Неожиданный ответ сервера.'}));if(!response.ok)throw Error(value.error||'Ошибка '+response.status);return value;
 }
 const date=value=>{if(!value)return '—';const d=new Date(value);return isNaN(d)?String(value):d.toLocaleString('ru-RU')};
 function cell(row,value,wrap=false){const td=document.createElement('td');td.textContent=value??'—';td.classList.toggle('wrap',wrap);row.append(td);return td}
 function button(parent,text,fn,link=false){const b=document.createElement('button');b.type='button';b.textContent=text;if(link)b.className='link';b.onclick=fn;parent.append(b);return b}
 function copyField(parent,value){const i=document.createElement('input');i.className='key';i.readOnly=true;i.value=value||'';i.onclick=()=>i.select();parent.append(i);return i}
 function userCell(tr,item){const td=cell(tr,'',true);button(td,item.email||'#'+item.user_id,()=>openAccount(item.user_id),true);return td}
 function mark(user,key,value){const change=dirty.get(user.user_id)||{};if(value===(user[key]??null))delete change[key];else change[key]=value;if(Object.keys(change).length)dirty.set(user.user_id,change);else dirty.delete(user.user_id);$('saveAll').disabled=!dirty.size||busy}
 async function operation(path,data,confirmText){if(busy||confirmText&&!confirm(confirmText))return false;busy=true;$('saveAll').disabled=true;try{await api(path,data);notice('Сохранено.');return true}catch(e){notice(e.message,true);return false}finally{busy=false;$('saveAll').disabled=!dirty.size}}
 async function saveUser(uid){const changes=dirty.get(uid);if(!changes)return;const captured={...changes};if(await operation('users/'+uid,captured)){dirty.delete(uid);await load(true);if(selected===uid)await refreshAccount()}}
 async function all(){if(!dirty.size)return;const captured=[...dirty].map(([uid,change])=>({user_id:uid,...change}));if(await operation('users/save-all',{users:captured})){dirty.clear();await load(true);if(selected)await refreshAccount()}}
 function filterOptions(){
  for(const [id,first] of [['filter','Все пользователи'],['consoleFilter','Все пользователи + сервер']]){
   const select=$(id),value=select.value,existing=new Map([...select.options].filter(o=>o.value&&o.value!=='server').map(o=>[o.value,o.textContent]));
   for(const user of state.users)existing.set(String(user.user_id),user.email+' · #'+user.user_id);
   select.replaceChildren(new Option(first,''));if(id==='consoleFilter')select.add(new Option('Только сервер','server'));for(const [uid,label] of existing)select.add(new Option(label,uid));select.value=value;
  }
  const value=$('consoleSession').value;$('consoleSession').replaceChildren(new Option('Все сессии',''));
  for(const item of state.sessions)$('consoleSession').add(new Option(item.email+' · '+item.session_id.slice(0,8),item.session_id));$('consoleSession').value=value;
 }
 async function separation(parent,id){
  const details=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('div');summary.textContent='#'+id;details.append(summary,body);parent.append(details);let loaded=false;
  details.ontoggle=async()=>{if(!details.open||loaded)return;body.textContent='Загрузка…';try{const data=await api('separations/'+id);body.replaceChildren();const p=document.createElement('div');p.textContent='Статус: '+(statuses[data.separation.status]||data.separation.status);body.append(p);if(!data.tokens.length)body.append('Токен отсутствует');for(const token of data.tokens)tokenCard(body,token);loaded=true}catch(e){body.textContent=e.message}};
 }
 function tokenCard(parent,token){const block=document.createElement('div');block.className='tokenCard';const label=document.createElement('div');label.textContent='№ '+token.token_id+' · '+token.type+' · '+token.status;block.append(label);copyField(block,token.token);const meta=document.createElement('div');meta.textContent='Сепарация: '+(token.separation_id??'Все сепарации аккаунта')+' · Выдан: '+date(token.issued_at)+(token.expires_at?' · До: '+date(token.expires_at):'');block.append(meta);parent.append(block)}
 function render(){
  const rows=state[tab],total=state.counts[tab];$('results').replaceChildren();for(const b of document.querySelectorAll('[data-tab]')){b.classList.toggle('selected',b.dataset.tab===tab);b.textContent=names[b.dataset.tab]+' · '+state.counts[b.dataset.tab]}
  $('subscriptions').classList.toggle('selected',tab==='subscriptions');$('subscriptions').textContent='Подписки · '+state.counts.subscriptions;$('serverCode').value=state.server_code;$('previous').disabled=offset===0;$('next').disabled=offset+200>=total;$('page').textContent=total?(offset+1)+'–'+Math.min(offset+rows.length,total)+' / '+total:'0';$('saveAll').disabled=!dirty.size||busy;
  if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='Записей нет.';$('results').append(p);return}
  const titles={users:['№','Пользователь','Имя','Доступ','Лимит','Цвет','Аккаунт','Действия'],sessions:['Пользователь','Устройство','Вход','Последняя операция','Действует до','Сепарации','Действия','Ключ входа'],separations:['Сепарация','Пользователь','Трек','Статус','Прогресс','Создана','Завершена','Файлы','Очистка не ранее'],tokens:['№','Пользователь','Токен','Тип','Статус','Сепарация','Выдан','До','Закрыт'],subscriptions:['№','Пользователь','План','Статус','Начало','До']};
  const table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr'),body=document.createElement('tbody');for(const title of titles[tab]){const th=document.createElement('th');th.textContent=title;hr.append(th)}head.append(hr);table.append(head,body);$('results').append(table);
  for(const item of rows){const tr=document.createElement('tr');body.append(tr);
   if(tab==='users'){
    const change=dirty.get(item.user_id)||{};cell(tr,item.user_id);userCell(tr,item);cell(tr,item.name,true);
    const select=document.createElement('select');for(const [v,t] of [['','Без доступа'],['Subscription','Subscription'],['OneTime','OneTime']])select.add(new Option(t,v));select.value=(Object.hasOwn(change,'status')?change.status:item.status)||'';select.onchange=()=>mark(item,'status',select.value||null);cell(tr,'').append(select);
    const limit=document.createElement('input');limit.type='number';limit.min=1;limit.max=100;limit.value=change.max_active_sessions??item.max_active_sessions;limit.oninput=()=>mark(item,'max_active_sessions',Number(limit.value));cell(tr,'').append(limit);
    const color=document.createElement('input');color.type='color';color.value=change.console_color||item.color;color.oninput=()=>mark(item,'console_color',color.value);const colorTd=cell(tr,'');colorTd.append(color);button(colorTd,'Auto',()=>{mark(item,'console_color',null);color.value=state.palette[(item.user_id-1)%24]});
    cell(tr,item.is_blocked?'Заблокирован':'Активен');const actions=cell(tr,'');actions.className='rowActions';button(actions,'Сохранить',()=>saveUser(item.user_id));button(actions,item.is_blocked?'Разблокировать':'Блокировать',async()=>{if(await operation('users/'+item.user_id,{is_blocked:!item.is_blocked},item.is_blocked?null:'Заблокировать аккаунт и завершить все сессии?')){await load(true);if(selected===item.user_id)await refreshAccount()}});
   }else if(tab==='sessions'){
    userCell(tr,item);cell(tr,item.device,true);cell(tr,date(item.created_at));cell(tr,date(item.last_seen_at));cell(tr,item.operation_running?'Выполняется операция':date(item.expires_at));const seps=cell(tr,'');if(!item.separations.length)seps.textContent='—';for(const sep of item.separations)separation(seps,sep.separation_id);button(cell(tr,''),'Завершить',async()=>{if(await operation('sessions/revoke',{session_id:item.session_id},'Завершить сессию?'))await load(true)});copyField(cell(tr,''),item.login_key);
   }else if(tab==='separations'){
    separation(cell(tr,''),item.separation_id);userCell(tr,item);cell(tr,item.source_name,true);cell(tr,statuses[item.status]||item.status);cell(tr,item.progress==null?'—':item.progress+'%');cell(tr,date(item.created_at));cell(tr,date(item.finished_at));cell(tr,item.file_status);cell(tr,date(item.delete_after));
   }else if(tab==='tokens'){
    cell(tr,item.token_id);userCell(tr,item);copyField(cell(tr,''),item.token);cell(tr,item.type);cell(tr,item.status);if(item.separation_id)separation(cell(tr,''),item.separation_id);else cell(tr,'Все');cell(tr,date(item.issued_at));cell(tr,date(item.expires_at));cell(tr,date(item.closed_at));
   }else{cell(tr,item.subscription_id??'Вручную');userCell(tr,item);cell(tr,item.plan_name);cell(tr,item.status);cell(tr,date(item.starts_at));cell(tr,date(item.ends_at))}
  }
 }
 async function load(preserve=false){if(loading)return;loading=true;try{state=await api('state?'+new URLSearchParams({q:$('search').value,user_id:$('filter').value,offset}));csrf=state.csrf;filterOptions();render();recolor();$('updated').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU');if(!preserve)notice(dirty.size?'Есть несохранённые изменения.':'')}catch(e){notice(e.message,true)}finally{loading=false}}
 function rightView(view){$('accountMenu').hidden=view!=='menu';$('profilePanel').hidden=view!=='profile';$('paymentsPanel').hidden=view!=='payments';$('profileEditor').hidden=true;$('accountTitle').textContent='MyNus — '+({menu:'Account',profile:'Profile',payments:'Payments'})[view]}
 let accountTicket=0;
 async function openAccount(uid){selected=uid;const ticket=++accountTicket;$('account').hidden=false;$('accountEmpty').hidden=true;$('accountNotice').textContent='Loading…';rightView('menu');try{const data=await api('users/'+uid+'/account');if(ticket!==accountTicket)return;accountData=data;renderAccount();$('accountNotice').textContent=''}catch(e){$('accountNotice').textContent=e.message}}
 async function refreshAccount(){if(!selected)return;const uid=selected;const data=await api('users/'+uid+'/account');if(selected===uid){accountData=data;renderAccount()}}
 function renderAccount(){
  const u=accountData.user;$('profileDetails').replaceChildren();for(const [name,value] of [['First name',u.first_name],['Last name',u.last_name],['Email',u.email],['Phone',u.phone],['Country',u.country],['Status',u.is_blocked?'Blocked':u.status||'No subscription']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=value||'—';$('profileDetails').append(dt,dd)}
  const plan=accountData.subscriptions[0]?.plan_name||'—';$('paymentSummary').textContent='Plan: '+plan+' · Status: '+(u.status||'No subscription');$('paymentType').value=u.status==='Subscription'?'Subscription':'OneTime';$('accountTokens').replaceChildren();for(const t of accountData.tokens)tokenCard($('accountTokens'),t);$('accountPayments').replaceChildren();if(!accountData.payments.length)$('accountPayments').textContent='No payments recorded.';for(const p of accountData.payments){const line=document.createElement('p');line.textContent=date(p.created_at)+' · '+p.amount_minor/100+' '+p.currency+' · '+p.status;$('accountPayments').append(line)}
 }
 $('openProfile').onclick=$('paymentsProfile').onclick=()=>rightView('profile');$('openPayments').onclick=$('profilePayments').onclick=()=>rightView('payments');for(const b of document.querySelectorAll('.accountBack'))b.onclick=()=>rightView('menu');
 $('profileChange').onclick=()=>{const u=accountData.user;for(const input of $('profileEditor').elements)if(input.name)input.value=u[input.name]||'';$('profileEditor').hidden=false};
 $('profileEditor').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target));if(await operation('users/'+selected,values)){await refreshAccount();await load(true);$('profileEditor').hidden=true}};
 $('confirmToken').onclick=async()=>{if(await operation('users/'+selected+'/tokens/confirm',{type:$('paymentType').value})){await refreshAccount();await load(true);$('accountNotice').textContent='Оплата подтверждена в тестовом режиме. Токен создан.'}};
 $('checkToken').onclick=async()=>{try{await refreshAccount();$('accountNotice').textContent='Токены обновлены.'}catch(e){$('accountNotice').textContent=e.message}};
 $('accountLogout').onclick=async()=>{if(await operation('sessions/revoke',{user_id:selected},'Завершить все сессии этого пользователя?')){await load(true);$('accountNotice').textContent='Сессии завершены.'}};
 $('accountClose').onclick=()=>{selected=null;accountTicket++;$('account').hidden=true;$('accountEmpty').hidden=false};
 for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;offset=0;load()};$('subscriptions').onclick=()=>{tab='subscriptions';offset=0;load()};$('saveAll').onclick=all;$('refresh').onclick=()=>load();$('previous').onclick=()=>{offset=Math.max(0,offset-200);load()};$('next').onclick=()=>{offset+=200;load()};$('filter').onchange=()=>{offset=0;load()};let debounce;$('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>{offset=0;load()},350)};
 let deviceCursor=0,serverCursor=0,consoleLoading=false,consoleGeneration=0;
 function resetConsole(){consoleGeneration++;deviceCursor=0;serverCursor=0;$('consoleText').replaceChildren();pollConsole()}
 $('consoleFilter').onchange=$('consoleSession').onchange=resetConsole;
 function recolor(){if(!state)return;const colors=new Map(state.users.map(u=>[String(u.user_id),u.color]));for(const row of $('consoleText').children)if(colors.has(row.dataset.userId))row.style.color=colors.get(row.dataset.userId)}
 function consoleKinds790(record){
  const text=String(record.message||''),level=String(record.level||'');
  const error=/^(?:error|critical|fatal)$/i.test(level)||/\b(?:ERROR|UNCAUGHT|UNHANDLED|FAILED|FAILURE|EXCEPTION|TRACEBACK|FATAL)\b|ошибк|не удалось|сбой|"\s+[45]\d{2}(?:\s|$)|\b(?:error|request)\s*\([45]\d{2}\)/i.test(text);
  const separations=/\b(?:separat\w*|demucs|htdemucs\w*)\b|сепарац|\/(?:separate|progress\/|abort\/|results\/|preview\/|api\/separations(?:\/|[?\s"]))/i.test(text);
  const payments=/\b(?:payments?|subscriptions?|OneTime)\b|оплат|подписк|токен|\/(?:api\/account\/tokens|api\/admin\/users\/\d+\/tokens)|\b(?:SUB|ONE)[A-Za-z0-9_-]{11}\b|\btoken\s*(?:№|#|created|issued|used|expired|revoked|received)/i.test(text);
  return {error,separations,payments};
 }
 function showConsoleRow790(row){
  const selected=$('consoleKind').value;
  row.hidden=selected!=='all'&&row.dataset[selected]!=='true';
 }
 function applyConsoleFilter790(){for(const row of $('consoleText').children)showConsoleRow790(row);}

 $('consoleKind').onchange=applyConsoleFilter790;
 async function pollConsole(){
  if(consoleLoading||!csrf||document.hidden)return;consoleLoading=true;const generation=consoleGeneration,uid=$('consoleFilter').value,sid=$('consoleSession').value;
  try{const data=await api('console?'+new URLSearchParams({device_after:deviceCursor,server_after:serverCursor,user_id:uid==='server'?'':uid,session_id:sid}));if(generation!==consoleGeneration)return;deviceCursor=data.device_cursor;serverCursor=data.server_cursor;
