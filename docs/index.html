<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ========================================
       BASIC SETTINGS
  ======================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MyNus</title>


  <style>

    /* ========================================
       PAGE
    ======================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #f3f3f3;
      color: #222;
    }


    /* ========================================
       APPLICATION
    ======================================== */

    .app {
      width: min(1200px, calc(100% - 30px));

      margin: 30px auto;
      padding: 25px;

      background: white;

      border-radius: 12px;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 0 0 25px;

      text-align: center;
      font-size: 26px;
    }


    /* ========================================
       FILE LOAD
    ======================================== */

    .load-row {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    #audioFile {
      display: none;
    }

    #selectFileBtn {
      min-width: 110px;
    }

    #fileName {
      flex: 1;

      padding: 9px 10px;

      overflow: hidden;

      background: #f5f5f5;

      border-radius: 7px;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 14px;
    }


    /* ========================================
       BUTTONS
    ======================================== */

    button {
      padding: 10px 16px;

      border: 0;
      border-radius: 7px;

      background: #222;
      color: white;

      cursor: pointer;
    }

    button:disabled {
      opacity: .5;

      cursor: default;
    }

    button.active {
      background: #777;
    }


    /* ========================================
       STATUS AND PROCESS
    ======================================== */

    #status {
      margin-top: 15px;
      min-height: 20px;

      text-align: center;
    }

    .progress-wrap {
      display: none;
      position: relative;

      width: 100%;
      height: 24px;

      margin-top: 12px;

      background: #e5e5e5;

      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: #222;

      transition:
        width .2s linear;
    }

    .progress-percent {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-family: monospace;
      font-size: 13px;
      font-weight: bold;

      mix-blend-mode: difference;

      pointer-events: none;
    }


    /* ========================================
       STUDIO
    ======================================== */

    #studio {
      display: none;

      margin-top: 25px;
    }


    /* ========================================
       TRANSPORT
    ======================================== */

    .transport {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;
      align-items: center;

      gap: 8px;

      margin-bottom: 20px;
    }

    .transport button {
      min-width: 72px;
    }

    #playBtn {
      min-width: 90px;
    }

    .time-display {
      min-width: 170px;

      padding: 8px 10px;

      background: #f3f3f3;

      border-radius: 6px;

      text-align: center;

      font-family: monospace;
      font-size: 14px;
    }


    /* ========================================
       ZOOM
    ======================================== */

    .zoom-row {
      display: flex;

      justify-content: flex-end;
      align-items: center;

      gap: 8px;

      margin-bottom: 10px;
    }

    .zoom-row button {
      width: 38px;
      min-width: 38px;

      padding: 7px;
    }

    #zoomValue {
      min-width: 70px;

      text-align: center;

      font-size: 13px;
    }


    /* ========================================
       TRACKS
    ======================================== */

    .track {
      display: grid;

      grid-template-columns:
        190px 1fr;

      gap: 12px;

      margin-bottom: 12px;
    }

    .track-controls {
      padding: 10px;

      background: #f5f5f5;

      border-radius: 8px;
    }

    .track-title {
      margin-bottom: 10px;

      font-weight: bold;
    }

    .track-buttons {
      display: flex;

      gap: 6px;

      margin-bottom: 10px;
    }

    .track-buttons button {
      flex: 1;

      padding: 6px;

      font-size: 12px;
    }

    .volume-row {
      display: flex;

      align-items: center;

      gap: 7px;
    }

    .volume-row input {
      width: 100%;
    }

    .volume-value {
      width: 40px;

      text-align: right;

      font-size: 12px;
    }

    .static-track-title {
      display: flex;

      align-items: center;
      justify-content: center;

      height: 100%;

      padding: 10px;

      background: #ececec;

      border-radius: 8px;

      font-weight: bold;
    }


    /* ========================================
       WAVEFORMS
    ======================================== */

    .timeline-scroll {
      position: relative;

      height: 92px;

      overflow-x: auto;
      overflow-y: hidden;

      background: #fafafa;

      border: 1px solid #ddd;
      border-radius: 8px;

      scrollbar-width: thin;
    }

    .timeline-inner {
      position: relative;

      height: 90px;

      min-width: 100%;
    }

    canvas {
      display: block;

      width: 100%;
      height: 90px;

      cursor: pointer;
    }

    .playhead {
      position: absolute;

      top: 0;
      bottom: 0;

      width: 2px;

      background: #111;

      pointer-events: none;

      z-index: 5;
    }


    /* ========================================
       MASTER TIMELINE
    ======================================== */

    .master-timeline-title {
      margin: 20px 0 8px 202px;

      font-size: 13px;
      font-weight: bold;
    }

    .master-timeline {
      position: relative;

      width: calc(100% - 202px);
      margin-left: 202px;

      height: 42px;

      overflow-x: auto;
      overflow-y: hidden;

      background: #ececec;

      border: 1px solid #ccc;
      border-radius: 7px;

      scrollbar-width: thin;
    }

    .master-timeline-inner {
      position: relative;

      height: 100%;

      min-width: 100%;

      cursor: pointer;
    }

    .master-ruler {
      position: absolute;

      inset: 0;
    }

    .master-ruler-mark {
      position: absolute;

      top: 0;
      bottom: 0;

      width: 1px;

      background: #bbb;
    }

    .master-ruler-label {
      position: absolute;

      top: 4px;

      transform: translateX(4px);

      font-size: 10px;
      color: #666;

      pointer-events: none;
    }

    .master-cursor {
      position: absolute;

      top: 0;
      bottom: 0;

      width: 3px;

      background: #111;

      cursor: ew-resize;

      z-index: 10;

      touch-action: none;
    }

    .master-cursor::before {
      content: "";

      position: absolute;

      top: 0;
      left: 50%;

      width: 14px;
      height: 14px;

      transform:
        translateX(-50%);

      background: #111;

      border-radius: 50%;
    }


    .selection-range {
      position: absolute;
      top: 0;
      bottom: 0;
      display: none;
      background: rgba(0,0,0,.12);
      border-left: 2px solid #555;
      border-right: 2px solid #555;
      pointer-events: none;
      z-index: 8;
    }

    .selection-info {
      margin-left: 202px;
      margin-top: 6px;
      min-height: 16px;
      font-family: monospace;
      font-size: 12px;
      color: #666;
    }

    .track-save-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .track-save-row button {
      flex: 1;
      padding: 6px;
      font-size: 11px;
    }



    .master-controls {
      align-self: stretch;
    }

    .master-state {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }

    .export-dialog {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.35);
    }

    .export-dialog.open {
      display: flex;
    }

    .export-dialog-card {
      width: min(360px, calc(100vw - 32px));
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }

    .export-dialog-title {
      margin-bottom: 14px;
      font-weight: bold;
    }

    .export-format-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 700px) {

      .track {
        grid-template-columns: 1fr;
      }

      .load-row {
        flex-direction: column;

        align-items: stretch;
      }

      #fileName {
        width: 100%;
      }

      .master-timeline-title {
        margin-left: 0;
      }

      .master-timeline {
        width: 100%;
        margin-left: 0;
      }

      .selection-info {
        margin-left: 0;
      }

    }

  </style>

</head>


<body>


<div class="app">

  <h1>MyNus</h1>


  <!-- ========================================
       FILE LOAD
  ======================================== -->

  <div class="load-row">

    <input
      type="file"
      id="audioFile"
      accept="audio/*"
    >

    <button
      type="button"
      id="selectFileBtn"
    >
      Select File
    </button>

    <div id="fileName">
      No file selected
    </div>

    <button id="splitBtn">
      Split
    </button>

  </div>


  <!-- ========================================
       PROCESS
  ======================================== -->

  <div id="status"></div>

  <div
    id="progressWrap"
    class="progress-wrap"
  >

    <div
      id="progressBar"
      class="progress-bar"
    ></div>

    <div
      id="progressPercent"
      class="progress-percent"
    >
      0%
    </div>

  </div>


  <!-- ========================================
       STUDIO
  ======================================== -->

  <div id="studio">


    <!-- ========================================
         TRANSPORT
    ======================================== -->

    <div class="transport">

      <button
        id="originalModeBtn"
        class="active"
      >
        Original
      </button>

      <button id="mixModeBtn">
        Mix
      </button>

      <button id="masterModeBtn">
        Master
      </button>

      <button id="startBtn">
        |&lt;
      </button>

      <button id="playBtn">
        Play
      </button>

      <button id="stopBtn">
        Stop
      </button>

      <button id="endBtn">
        &gt;|
      </button>

      <div
        id="timeDisplay"
        class="time-display"
      >
        00:00.00 / 00:00.00 / -00:00.00
      </div>

    </div>


    <!-- ========================================
         ZOOM
    ======================================== -->

    <div class="zoom-row">

      <span>Timeline</span>

      <button id="zoomOutBtn">
        −
      </button>

      <span id="zoomValue">
        40 px/s
      </span>

      <button id="zoomInBtn">
        +
      </button>

    </div>


    <!-- ========================================
         ORIGINAL TRACK
    ======================================== -->

    <div class="track">

      <div class="track-controls">

        <div class="track-title">
          Original
        </div>

        <div class="track-save-row">
          <button data-export-track="original" data-export-scope="full">
            Save As...
          </button>
          <button data-export-track="original" data-export-scope="selection">
            Save Selection
          </button>
        </div>

      </div>

      <div
        class="timeline-scroll"
        data-track="original"
      >

        <div
          class="timeline-inner"
          id="originalTimeline"
        >

          <canvas id="originalCanvas"></canvas>

          <div
            class="playhead"
            id="originalPlayhead"
          ></div>

        </div>

      </div>

    </div>


    <!-- ========================================
         VOCALS TRACK
    ======================================== -->

    <div class="track">

      <div class="track-controls">

        <div class="track-title">
          Vocals
        </div>

        <div class="track-buttons">

          <button id="vocalsMuteBtn">
            Mute
          </button>

          <button id="vocalsSoloBtn">
            Solo
          </button>

        </div>

        <div class="volume-row">

          <input
            type="range"
            id="vocalsVolume"
            min="0"
            max="100"
            value="100"
          >

          <span
            id="vocalsVolumeValue"
            class="volume-value"
          >
            100%
          </span>

        </div>

        <div class="track-save-row">
          <button data-export-track="vocals" data-export-scope="full">
            Save As...
          </button>
          <button data-export-track="vocals" data-export-scope="selection">
            Save Selection
          </button>
        </div>

      </div>


      <div
        class="timeline-scroll"
        data-track="vocals"
      >

        <div
          class="timeline-inner"
          id="vocalsTimeline"
        >

          <canvas id="vocalsCanvas"></canvas>

          <div
            class="playhead"
            id="vocalsPlayhead"
          ></div>

        </div>

      </div>

    </div>


    <!-- ========================================
         INSTRUMENTAL TRACK
    ======================================== -->

    <div class="track">

      <div class="track-controls">

        <div class="track-title">
          Instrumental
        </div>

        <div class="track-buttons">

          <button id="minusMuteBtn">
            Mute
          </button>

          <button id="minusSoloBtn">
            Solo
          </button>

        </div>

        <div class="volume-row">

          <input
            type="range"
            id="minusVolume"
            min="0"
            max="100"
            value="100"
          >

          <span
            id="minusVolumeValue"
            class="volume-value"
          >
            100%
          </span>

        </div>

        <div class="track-save-row">
          <button data-export-track="minus" data-export-scope="full">
            Save As...
          </button>
          <button data-export-track="minus" data-export-scope="selection">
            Save Selection
          </button>
        </div>

      </div>


      <div
        class="timeline-scroll"
        data-track="minus"
      >

        <div
          class="timeline-inner"
          id="minusTimeline"
        >

          <canvas id="minusCanvas"></canvas>

          <div
            class="playhead"
            id="minusPlayhead"
          ></div>

        </div>

      </div>

    </div>


    <!-- ========================================
         MASTER TRACK
    ======================================== -->

    <div class="track">

      <div class="track-controls master-controls">

        <div class="track-title">
          Master
        </div>

        <div class="track-buttons">
          <button id="recordMasterBtn">Record</button>
          <button id="stopMasterBtn" disabled>Stop</button>
        </div>

        <div class="track-buttons">
          <button id="saveMasterBtn" disabled>Save</button>
          <button id="saveAsMasterBtn" disabled>Save As...</button>
        </div>

        <div class="track-save-row">
          <button id="saveMasterSelectionBtn" disabled>
            Save Selection
          </button>
        </div>

        <div id="masterState" class="master-state">
          Empty
        </div>

      </div>

      <div
        class="timeline-scroll"
        data-track="master"
      >

        <div
          class="timeline-inner"
          id="masterTrackTimeline"
        >

          <canvas id="masterCanvas"></canvas>

          <div
            class="playhead"
            id="masterPlayhead"
          ></div>

        </div>

      </div>

    </div>


    <!-- ========================================
         MASTER TIMELINE
    ======================================== -->

    <div class="master-timeline-title">
      Master Timeline
    </div>

    <div
      id="masterTimeline"
      class="master-timeline"
    >

      <div
        id="masterTimelineInner"
        class="master-timeline-inner"
      >

        <div
          id="masterRuler"
          class="master-ruler"
        ></div>

        <div
          id="selectionRange"
          class="selection-range"
        ></div>

        <div
          id="masterCursor"
          class="master-cursor"
        ></div>

      </div>

    </div>

  </div>

</div>



<!-- ========================================
     MASTER EXPORT DIALOG
======================================== -->

<div id="masterExportDialog" class="export-dialog">
  <div class="export-dialog-card">

    <div class="export-dialog-title">
      Save Audio As
    </div>

    <div class="export-format-grid">
      <button data-master-format="wav">WAV</button>
      <button data-master-format="mp3">MP3</button>
      <button data-master-format="flac">FLAC</button>
      <button data-master-format="m4a">M4A</button>
    </div>

    <button id="cancelMasterExportBtn">
      Cancel
    </button>

  </div>
</div>


<!-- ========================================
     HIDDEN AUDIO SOURCES
======================================== -->

<audio id="originalAudio"></audio>
<audio id="vocalsAudio"></audio>
<audio id="minusAudio"></audio>
<audio id="masterAudio"></audio>


<script>


// ========================================
// PAGE ELEMENTS
// ========================================

const audioFile =
  document.getElementById("audioFile");

const selectFileBtn =
  document.getElementById("selectFileBtn");

const fileName =
  document.getElementById("fileName");

const splitBtn =
  document.getElementById("splitBtn");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressPercent =
  document.getElementById("progressPercent");

const studio =
  document.getElementById("studio");

const originalModeBtn =
  document.getElementById("originalModeBtn");

const mixModeBtn =
  document.getElementById("mixModeBtn");

const masterModeBtn =
  document.getElementById("masterModeBtn");

const recordMasterBtn =
  document.getElementById("recordMasterBtn");

const stopMasterBtn =
  document.getElementById("stopMasterBtn");

const saveMasterBtn =
  document.getElementById("saveMasterBtn");

const saveAsMasterBtn =
  document.getElementById("saveAsMasterBtn");

const saveMasterSelectionBtn =
  document.getElementById("saveMasterSelectionBtn");

const selectionRange =
  document.getElementById("selectionRange");

const selectionInfo =
  document.getElementById("selectionInfo");

const masterState =
  document.getElementById("masterState");

const masterExportDialog =
  document.getElementById("masterExportDialog");

const cancelMasterExportBtn =
  document.getElementById("cancelMasterExportBtn");

const startBtn =
  document.getElementById("startBtn");

const playBtn =
  document.getElementById("playBtn");

const stopBtn =
  document.getElementById("stopBtn");

const endBtn =
  document.getElementById("endBtn");

const timeDisplay =
  document.getElementById("timeDisplay");

const originalAudio =
  document.getElementById("originalAudio");

const vocalsAudio =
  document.getElementById("vocalsAudio");

const minusAudio =
  document.getElementById("minusAudio");

const masterAudio =
  document.getElementById("masterAudio");

const vocalsMuteBtn =
  document.getElementById("vocalsMuteBtn");

const vocalsSoloBtn =
  document.getElementById("vocalsSoloBtn");

const minusMuteBtn =
  document.getElementById("minusMuteBtn");

const minusSoloBtn =
  document.getElementById("minusSoloBtn");

const vocalsVolume =
  document.getElementById("vocalsVolume");

const minusVolume =
  document.getElementById("minusVolume");

const vocalsVolumeValue =
  document.getElementById("vocalsVolumeValue");

const minusVolumeValue =
  document.getElementById("minusVolumeValue");

const zoomOutBtn =
  document.getElementById("zoomOutBtn");

const zoomInBtn =
  document.getElementById("zoomInBtn");

const zoomValue =
  document.getElementById("zoomValue");

const masterTimeline =
  document.getElementById("masterTimeline");

const masterTimelineInner =
  document.getElementById("masterTimelineInner");

const masterCursor =
  document.getElementById("masterCursor");

const masterRuler =
  document.getElementById("masterRuler");


const canvases = {

  original:
    document.getElementById("originalCanvas"),

  vocals:
    document.getElementById("vocalsCanvas"),

  minus:
    document.getElementById("minusCanvas"),

  master:
    document.getElementById("masterCanvas")

};


const timelines = {

  original:
    document.getElementById("originalTimeline"),

  vocals:
    document.getElementById("vocalsTimeline"),

  minus:
    document.getElementById("minusTimeline"),

  master:
    document.getElementById("masterTrackTimeline")

};


const playheads = {

  original:
    document.getElementById("originalPlayhead"),

  vocals:
    document.getElementById("vocalsPlayhead"),

  minus:
    document.getElementById("minusPlayhead"),

  master:
    document.getElementById("masterPlayhead")

};


const scrollAreas =
  [...document.querySelectorAll(".timeline-scroll")];


// ========================================
// APPLICATION STATE
// ========================================

let mode =
  "original";

let isPlaying =
  false;

let duration =
  0;

let pixelsPerSecond =
  40;

let originalFileURL =
  null;

let waveformData = {

  original: null,

  vocals: null,

  minus: null,

  master: null

};

let vocalsMuted =
  false;

let vocalsSolo =
  false;

let minusMuted =
  false;

let minusSolo =
  false;

let animationFrame =
  null;

let scrollSyncLock =
  false;

let masterCursorDragging =
  false;


// ========================================
// MASTER RECORDING STATE
// ========================================

let mixAudioContext = null;
let vocalsSourceNode = null;
let minusSourceNode = null;
let vocalsGainNode = null;
let minusGainNode = null;
let masterAnalyserNode = null;
let masterRecordDestination = null;
let masterRecorder = null;
let masterRecordChunks = [];
let masterRecording = false;

let masterBlob = null;
let savedMasterBlob = null;
let masterObjectURL = null;
let masterRecordStartTime = 0;
let masterRecordTimelineStart = 0;
let masterRecordAnimation = null;
let masterLivePeaks = [];
let masterDuration = 0;


// ========================================
// FILE SELECTION
// ========================================

selectFileBtn.addEventListener(
  "click",
  () => {

    audioFile.click();

  }
);


audioFile.addEventListener(
  "change",
  () => {

    const file =
      audioFile.files[0];


    fileName.textContent =
      file
        ? file.name
        : "No file selected";

  }
);


// ========================================
// AUDIO SEPARATION
// ========================================

splitBtn.addEventListener(
  "click",
  async () => {

    const file =
      audioFile.files[0];


    if (!file) {

      status.textContent =
        "Select an audio file";

      return;

    }


    const formData =
      new FormData();


    formData.append(
      "audio",
      file
    );


    splitBtn.disabled =
      true;


    studio.style.display =
      "none";


    progressWrap.style.display =
      "block";


    progressBar.style.width =
      "0%";


    progressPercent.textContent =
      "0%";


    status.textContent =
      "Separating...";


    try {

      if (originalFileURL) {

        URL.revokeObjectURL(
          originalFileURL
        );

      }


      originalFileURL =
        URL.createObjectURL(
          file
        );


      originalAudio.src =
        originalFileURL;


      const response =
        await fetch(
          "/separate",
          {

            method: "POST",

            body: formData

          }
        );


      if (!response.ok) {

        let errorData = {};


        try {

          errorData =
            await response.json();

        }

        catch {

          errorData = {};

        }


        throw new Error(

          errorData.details
          || errorData.error
          || "Server error"

        );

      }


      const startData =
        await response.json();


      const jobId =
        startData.job_id;


      resetMaster();


      const data =
        await waitForSeparation(
          jobId
        );


      vocalsAudio.src =
        data.vocals;


      minusAudio.src =
        data.minus;


      currentOriginalFile =
        file;


      currentVocalsURL =
        data.vocals;


      currentMinusURL =
        data.minus;


      status.textContent =
        "Loading tracks...";


      await Promise.all([

        waitForMetadata(
          originalAudio
        ),

        waitForMetadata(
          vocalsAudio
        ),

        waitForMetadata(
          minusAudio
        )

      ]);


      duration =
        originalAudio.duration;


      await loadWaveforms(
        file,
        data.vocals,
        data.minus
      );


      resetTransport();

          drawAllWaveforms();

      drawMasterTimeline();


      studio.style.display =
        "block";


      progressBar.style.width =
        "100%";


      progressPercent.textContent =
        "100%";


      status.textContent =
        "Ready";

    }


    catch (error) {

      console.error(
        error
      );


      status.textContent =
        "Processing error: "
        + error.message;

    }


    finally {

      splitBtn.disabled =
        false;

    }

  }
);


// ========================================
// DEMUCS PROGRESS
// ========================================

async function waitForSeparation(
  jobId
) {

  while (true) {

    const response =
      await fetch(
        "/progress/"
        + jobId
      );


    if (!response.ok) {

      throw new Error(
        "Progress request failed"
      );

    }


    const data =
      await response.json();


    const progress =
      Number(
        data.progress || 0
      );


    progressBar.style.width =
      progress
      + "%";


    progressPercent.textContent =
      progress
      + "%";


    status.textContent =
      "Separating...";


    if (
      data.status === "done"
    ) {

      progressBar.style.width =
        "100%";


      progressPercent.textContent =
        "100%";


      return data;

    }


    if (
      data.status === "error"
    ) {

      throw new Error(

        data.error
        || "Demucs error"

      );

    }


    await sleep(
      300
    );

  }

}


function sleep(
  milliseconds
) {

  return new Promise(

    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )

  );

}


// ========================================
// AUDIO METADATA
// ========================================

function waitForMetadata(
  audio
) {

  return new Promise(
    (resolve, reject) => {

      if (
        Number.isFinite(
          audio.duration
        )
        &&
        audio.duration > 0
      ) {

        resolve();

        return;

      }


      audio.addEventListener(
        "loadedmetadata",
        resolve,
        {
          once: true
        }
      );


      audio.addEventListener(
        "error",
        reject,
        {
          once: true
        }
      );

    }
  );

}


// ========================================
// WAVEFORM DECODING
// ========================================

async function loadWaveforms(
  originalFile,
  vocalsURL,
  minusURL
) {

  const audioContext =
    new AudioContext();


  const originalBuffer =
    await originalFile.arrayBuffer();


  const vocalsBuffer =
    await fetch(
      vocalsURL
    )
    .then(
      response =>
        response.arrayBuffer()
    );


  const minusBuffer =
    await fetch(
      minusURL
    )
    .then(
      response =>
        response.arrayBuffer()
    );


  waveformData.original =
    await audioContext.decodeAudioData(
      originalBuffer.slice(0)
    );


  waveformData.vocals =
    await audioContext.decodeAudioData(
      vocalsBuffer.slice(0)
    );


  waveformData.minus =
    await audioContext.decodeAudioData(
      minusBuffer.slice(0)
    );


  await audioContext.close();

}

// ========================================
// WAVEFORM DRAWING
// ========================================

function drawAllWaveforms() {

  drawWaveform(
    canvases.original,
    timelines.original,
    waveformData.original
  );


  drawWaveform(
    canvases.vocals,
    timelines.vocals,
    waveformData.vocals
  );


  drawWaveform(
    canvases.minus,
    timelines.minus,
    waveformData.minus
  );


  drawMasterCompositeWaveform();


  updatePlayheads();

  updateMasterCursor();

function drawWaveform(
  canvas,
  timeline,
  audioBuffer
) {

  if (!audioBuffer) {

    if (
      canvas === canvases.master
    ) {

      clearMasterCanvas();

    }

    return;

  }


  const width =
    getTimelineWidth();


  const height =
    90;


  timeline.style.width =
    width
    + "px";


  canvas.width =
    width;


  canvas.height =
    height;


  canvas.style.width =
    width
    + "px";


  canvas.style.height =
    height
    + "px";


  const context =
    canvas.getContext("2d");


  context.clearRect(
    0,
    0,
    width,
    height
  );


  const samples =
    audioBuffer.getChannelData(0);


  const step =
    Math.max(
      1,
      Math.floor(
        samples.length
        / width
      )
    );


  const middle =
    height / 2;


  context.beginPath();


  for (
    let x = 0;
    x < width;
    x++
  ) {

    const start =
      x
      * step;


    let min =
      1;


    let max =
      -1;


    for (
      let i = 0;
      i < step;
      i++
    ) {

      const sample =
        samples[
          start + i
        ];


      if (
        sample === undefined
      ) {

        break;

      }


      if (
        sample < min
      ) {

        min =
          sample;

      }


      if (
        sample > max
      ) {

        max =
          sample;

      }

    }


    const y1 =
      middle
      +
      min
      * middle;


    const y2 =
      middle
      +
      max
      * middle;


    context.moveTo(
      x,
      y1
    );


    context.lineTo(
      x,
      y2
    );

  }


  context.strokeStyle =
    "#333";


  context.lineWidth =
    1;


  context.stroke();

}


function getTimelineWidth() {

  return Math.max(
    800,
    Math.ceil(
      duration
      * pixelsPerSecond
    )
  );

}


// ========================================
// MASTER TIMELINE DRAWING
// ========================================

function drawMasterTimeline() {

  const width =
    getTimelineWidth();


  masterTimelineInner.style.width =
    width
    + "px";


  masterRuler.innerHTML =
    "";


  let interval =
    10;


  if (
    pixelsPerSecond >= 80
  ) {

    interval =
      5;

  }


  if (
    pixelsPerSecond >= 140
  ) {

    interval =
      1;

  }


  for (
    let second = 0;
    second <= duration;
    second += interval
  ) {

    const x =
      second
      * pixelsPerSecond;


    const mark =
      document.createElement(
        "div"
      );


    mark.className =
      "master-ruler-mark";


    mark.style.left =
      x
      + "px";


    masterRuler.appendChild(
      mark
    );


    const label =
      document.createElement(
        "div"
      );


    label.className =
      "master-ruler-label";


    label.style.left =
      x
      + "px";


    label.textContent =
      formatShortTime(
        second
      );


    masterRuler.appendChild(
      label
    );

  }


  updateMasterCursor();

}

function switchMode(
  newMode
) {

  if (
    mode === newMode
  ) {

    return;

  }


  const time =
    getCurrentTime();


  const wasPlaying =
    isPlaying;


  originalAudio.pause();

  vocalsAudio.pause();

  minusAudio.pause();

  masterAudio.pause();


  mode =
    newMode;


  originalModeBtn.classList.toggle(
    "active",
    mode === "original"
  );


  mixModeBtn.classList.toggle(
    "active",
    mode === "mix"
  );


  masterModeBtn.classList.toggle(
    "active",
    mode === "master"
  );


  syncAllTo(
    time
  );


  if (
    wasPlaying
  ) {

    if (
      mode === "original"
    ) {

      originalAudio.play();

    }

    else if (
      mode === "master"
    ) {

      masterAudio.play();

    }

    else {

      ensureMixAudioGraph();

      if (mixAudioContext.state === "suspended") {
        mixAudioContext.resume();
      }

      applyMix();

      vocalsAudio.play();

      minusAudio.play();

    }

  }


  updatePlayheads();

  updateMasterCursor();

  updateTimeDisplay();

}

function applyMix() {

  const anySolo =
    vocalsSolo
    ||
    minusSolo;


  const vocalsEnabled =
    !vocalsMuted
    &&
    (
      !anySolo
      ||
      vocalsSolo
    );


  const minusEnabled =
    !minusMuted
    &&
    (
      !anySolo
      ||
      minusSolo
    );


  const vocalsLevel =
    vocalsEnabled
    ? Number(vocalsVolume.value) / 100
    : 0;


  const minusLevel =
    minusEnabled
    ? Number(minusVolume.value) / 100
    : 0;


  if (vocalsGainNode && minusGainNode) {

    vocalsAudio.volume = 1;
    minusAudio.volume = 1;

    vocalsGainNode.gain.value =
      vocalsLevel;

    minusGainNode.gain.value =
      minusLevel;

  }

  else {

    vocalsAudio.volume =
      vocalsLevel;

    minusAudio.volume =
      minusLevel;

  }


  updatePlayheads();

}


// ========================================
// MASTER AUDIO ROUTING
// ========================================

function ensureMixAudioGraph() {

  if (mixAudioContext) {
    return;
  }

  mixAudioContext =
    new AudioContext();

  vocalsSourceNode =
    mixAudioContext
      .createMediaElementSource(
        vocalsAudio
      );

  minusSourceNode =
    mixAudioContext
      .createMediaElementSource(
        minusAudio
      );

  vocalsGainNode =
    mixAudioContext.createGain();

  minusGainNode =
    mixAudioContext.createGain();

  masterAnalyserNode =
    mixAudioContext.createAnalyser();

  masterAnalyserNode.fftSize =
    2048;

  masterRecordDestination =
    mixAudioContext
      .createMediaStreamDestination();

  vocalsSourceNode.connect(
    vocalsGainNode
  );

  minusSourceNode.connect(
    minusGainNode
  );

  vocalsGainNode.connect(
    mixAudioContext.destination
  );

  minusGainNode.connect(
    mixAudioContext.destination
  );

  vocalsGainNode.connect(
    masterAnalyserNode
  );

  minusGainNode.connect(
    masterAnalyserNode
  );

  vocalsGainNode.connect(
    masterRecordDestination
  );

  minusGainNode.connect(
    masterRecordDestination
  );

  vocalsAudio.volume = 1;
  minusAudio.volume = 1;

  applyMix();

}


// ========================================
// MASTER RECORDING
// ========================================

recordMasterBtn.addEventListener(
  "click",
  startMasterRecording
);

stopMasterBtn.addEventListener(
  "click",
  stopMasterRecording
);


async function startMasterRecording() {

  if (masterRecording) {
    return;
  }

  activateMixMode();

  ensureMixAudioGraph();

  if (
    mixAudioContext.state === "suspended"
  ) {

    await mixAudioContext.resume();

  }

  waveformData.master =
    null;

  masterBlob =
    null;

  savedMasterBlob =
    null;

  masterLivePeaks =
    [];

  clearMasterCanvas();

  const mimeTypes = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/ogg;codecs=opus"
  ];

  const mimeType =
    mimeTypes.find(
      type =>
        MediaRecorder
          .isTypeSupported(type)
    )
    || "";

  masterRecordChunks =
    [];

  masterRecorder =
    mimeType
    ? new MediaRecorder(
        masterRecordDestination.stream,
        { mimeType }
      )
    : new MediaRecorder(
        masterRecordDestination.stream
      );

  masterRecorder.addEventListener(
    "dataavailable",
    event => {

      if (
        event.data
        &&
        event.data.size > 0
      ) {

        masterRecordChunks.push(
          event.data
        );

      }

    }
  );

  masterRecorder.addEventListener(
    "stop",
    finishMasterRecording,
    { once: true }
  );

  masterRecorder.start(
    250
  );

  masterRecording =
    true;

  masterRecordStartTime =
    performance.now();

  masterRecordTimelineStart =
    getCurrentTime();

  recordMasterBtn.disabled =
    true;

  stopMasterBtn.disabled =
    false;

  saveMasterBtn.disabled =
    true;

  saveAsMasterBtn.disabled =
    true;

  masterState.textContent =
    "Recording...";

  startMasterWaveformCapture();

  if (!isPlaying) {

    playCurrentMode();

  }

}


function stopMasterRecording() {

  if (
    !masterRecorder
    ||
    masterRecorder.state === "inactive"
  ) {

    return;

  }

  masterRecorder.stop();

  masterRecording =
    false;

  stopMasterWaveformCapture();

  recordMasterBtn.disabled =
    false;

  stopMasterBtn.disabled =
    true;

  masterState.textContent =
    "Processing recording...";

}


async function finishMasterRecording() {

  const type =
    masterRecorder.mimeType
    || "audio/webm";


  const segmentBlob =
    new Blob(
      masterRecordChunks,
      { type }
    );


  try {

    const arrayBuffer =
      await segmentBlob.arrayBuffer();


    const decodeContext =
      new AudioContext();


    const segmentBuffer =
      await decodeContext
        .decodeAudioData(
          arrayBuffer.slice(0)
        );


    await decodeContext.close();


    masterSegments.push({
      start:
        masterRecordTimelineStart,
      buffer:
        segmentBuffer
    });


    await rebuildMasterTrack();


    drawMasterCompositeWaveform();

  }

  catch (error) {

    console.error(
      "Master segment decode error:",
      error
    );


    masterState.textContent =
      "Master recording error";


    status.textContent =
      "Master recording error";


    return;

  }


  masterState.textContent =
    "Recorded — not saved";


  saveMasterBtn.disabled =
    false;


  saveAsMasterBtn.disabled =
    false;


  saveMasterSelectionBtn.disabled =
    selectionStart !== null
    &&
    selectionEnd !== null;


  status.textContent =
    "Master recording complete";

}



function drawMasterCompositeWaveform() {

  clearMasterCanvas();


  const canvas =
    canvases.master;


  const context =
    canvas.getContext("2d");


  const height =
    90;


  const middle =
    height / 2;


  context.beginPath();


  masterSegments.forEach(
    segment => {

      drawBufferAtTimelinePosition(
        context,
        segment.buffer,
        segment.start,
        middle
      );

    }
  );


  if (
    masterRecording
    &&
    masterLivePeaks.length > 0
  ) {

    drawLivePeaksIntoContext(
      context,
      middle
    );

  }


  context.strokeStyle =
    "#333";


  context.lineWidth =
    1;


  context.stroke();

}


function drawBufferAtTimelinePosition(
  context,
  audioBuffer,
  startTime,
  middle
) {

  const width =
    getTimelineWidth();


  const samples =
    audioBuffer.getChannelData(0);


  const recordWidth =
    Math.max(
      1,
      Math.ceil(
        audioBuffer.duration
        * pixelsPerSecond
      )
    );


  const startX =
    startTime
    * pixelsPerSecond;


  const step =
    Math.max(
      1,
      Math.floor(
        samples.length
        / recordWidth
      )
    );


  for (
    let x = 0;
    x < recordWidth;
    x++
  ) {

    const drawX =
      startX + x;


    if (drawX >= width) {
      break;
    }


    const sampleStart =
      x * step;


    let min =
      1;


    let max =
      -1;


    for (
      let i = 0;
      i < step;
      i++
    ) {

      const sample =
        samples[
          sampleStart + i
        ];


      if (
        sample === undefined
      ) {

        break;

      }


      if (sample < min) {
        min = sample;
      }


      if (sample > max) {
        max = sample;
      }

    }


    context.moveTo(
      drawX,
      middle + min * middle
    );


    context.lineTo(
      drawX,
      middle + max * middle
    );

  }

}


function drawLivePeaksIntoContext(
  context,
  middle
) {

  const elapsed =
    Math.max(
      0,
      (
        performance.now()
        - masterRecordStartTime
      ) / 1000
    );


  const startX =
    masterRecordTimelineStart
    * pixelsPerSecond;


  const recordedWidth =
    Math.max(
      0,
      Math.min(
        getTimelineWidth()
        - startX,
        elapsed
        * pixelsPerSecond
      )
    );


  if (recordedWidth <= 0) {
    return;
  }


  for (
    let x = 0;
    x < recordedWidth;
    x++
  ) {

    const index =
      Math.min(
        masterLivePeaks.length - 1,
        Math.floor(
          x
          / recordedWidth
          * masterLivePeaks.length
        )
      );


    const peak =
      masterLivePeaks[index];


    const drawX =
      startX + x;


    context.moveTo(
      drawX,
      middle - peak * middle
    );


    context.lineTo(
      drawX,
      middle + peak * middle
    );

  }

}


async function rebuildMasterTrack() {

  if (
    !duration
    ||
    masterSegments.length === 0
  ) {

    return;

  }


  const sampleRate =
    masterSegments[0]
      .buffer
      .sampleRate;


  const channels =
    Math.max(
      1,
      ...masterSegments.map(
        segment =>
          segment.buffer
            .numberOfChannels
      )
    );


  const frameCount =
    Math.ceil(
      duration
      * sampleRate
    );


  const audioContext =
    new AudioContext();


  const fullBuffer =
    audioContext.createBuffer(
      channels,
      frameCount,
      sampleRate
    );


  masterSegments.forEach(
    segment => {

      const startFrame =
        Math.max(
          0,
          Math.floor(
            segment.start
            * sampleRate
          )
        );


      for (
        let channel = 0;
        channel < channels;
        channel++
      ) {

        const output =
          fullBuffer
            .getChannelData(
              channel
            );


        const source =
          segment.buffer
            .getChannelData(
              Math.min(
                channel,
                segment.buffer
                  .numberOfChannels - 1
              )
            );


        const copyLength =
          Math.min(
            source.length,
            output.length
            - startFrame
          );


        for (
          let i = 0;
          i < copyLength;
          i++
        ) {

          const index =
            startFrame + i;


          output[index] =
            Math.max(
              -1,
              Math.min(
                1,
                output[index]
                + source[i]
              )
            );

        }

      }

    }
  );


  masterBlob =
    audioBufferToWavBlob(
      fullBuffer
    );


  waveformData.master =
    fullBuffer;


  masterDuration =
    duration;


  if (masterObjectURL) {

    URL.revokeObjectURL(
      masterObjectURL
    );

  }


  masterObjectURL =
    URL.createObjectURL(
      masterBlob
    );


  masterAudio.src =
    masterObjectURL;


  await waitForMetadata(
    masterAudio
  );


  await audioContext.close();

}


function audioBufferToWavBlob(
  audioBuffer
) {

  const channels =
    audioBuffer.numberOfChannels;


  const sampleRate =
    audioBuffer.sampleRate;


  const frameCount =
    audioBuffer.length;


  const bytesPerSample =
    2;


  const blockAlign =
    channels
    * bytesPerSample;


  const dataSize =
    frameCount
    * blockAlign;


  const buffer =
    new ArrayBuffer(
      44 + dataSize
    );


  const view =
    new DataView(
      buffer
    );


  function writeString(
    offset,
    value
  ) {

    for (
      let i = 0;
      i < value.length;
      i++
    ) {

      view.setUint8(
        offset + i,
        value.charCodeAt(i)
      );

    }

  }


  writeString(
    0,
    "RIFF"
  );


  view.setUint32(
    4,
    36 + dataSize,
    true
  );


  writeString(
    8,
    "WAVE"
  );


  writeString(
    12,
    "fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    channels,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    sampleRate
    * blockAlign,
    true
  );


  view.setUint16(
    32,
    blockAlign,
    true
  );


  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    36,
    "data"
  );


  view.setUint32(
    40,
    dataSize,
    true
  );


  let offset =
    44;


  for (
    let i = 0;
    i < frameCount;
    i++
  ) {

    for (
      let channel = 0;
      channel < channels;
      channel++
    ) {

      const sample =
        Math.max(
          -1,
          Math.min(
            1,
            audioBuffer
              .getChannelData(
                channel
              )[i]
          )
        );


      const value =
        sample < 0
        ? sample * 0x8000
        : sample * 0x7fff;


      view.setInt16(
        offset,
        value,
        true
      );


      offset +=
        2;

    }

  }


  return new Blob(
    [buffer],
    {
      type: "audio/wav"
    }
  );

}

function startMasterWaveformCapture() {

  stopMasterWaveformCapture();

  const samples =
    new Float32Array(
      masterAnalyserNode.fftSize
    );

  const capture =
    () => {

      if (!masterRecording) {
        return;
      }

      masterAnalyserNode
        .getFloatTimeDomainData(
          samples
        );

      let peak =
        0;

      for (
        let i = 0;
        i < samples.length;
        i++
      ) {

        peak =
          Math.max(
            peak,
            Math.abs(
              samples[i]
            )
          );

      }

      masterLivePeaks.push(
        Math.min(
          1,
          peak
        )
      );

      drawLiveMasterWaveform();

      masterRecordAnimation =
        requestAnimationFrame(
          capture
        );

    };

  capture();

}


function stopMasterWaveformCapture() {

  if (masterRecordAnimation) {

    cancelAnimationFrame(
      masterRecordAnimation

    masterRecordAnimation =

}

async function getTrackBlob(
  track
) {

  if (
    track === "original"
  ) {

    return {
      blob:
        currentOriginalFile,
      filename:
        currentOriginalFile
        ? currentOriginalFile.name
        : "original.bin"
    };

  }


  if (
    track === "vocals"
  ) {

    const response =
      await fetch(
        currentVocalsURL
      );


    return {
      blob:
        await response.blob(),
      filename:
        "vocals.mp3"
    };

  }


  if (
    track === "minus"
  ) {

    const response =
      await fetch(
        currentMinusURL
      );


    return {
      blob:
        await response.blob(),
      filename:
        "instrumental.mp3"
    };

  }


  return {
    blob:
      savedMasterBlob
      || masterBlob,
    filename:
      "master.wav"
  };

}


async function exportTrack(
  track,
  scope,
  format
) {

  const source =
    await getTrackBlob(
      track
    );


  if (!source.blob) {

    status.textContent =
      "Track is not available";

    return;

  }


  const formData =
    new FormData();


  formData.append(
    "audio",
    source.blob,
    source.filename
  );


  formData.append(
    "format",
    format
  );


  formData.append(
    "track",
    track
  );


  if (
    scope === "selection"
  ) {

    formData.append(
      "start",
      String(
        selectionStart
      )
    );


    formData.append(
      "end",
      String(
        selectionEnd
      )
    );

  }


  status.textContent =
    "Exporting "
    + track
    + " as "
    + format.toUpperCase()
    + "...";


  try {

    const response =
      await fetch(
        "/export-audio",
        {
          method: "POST",
          body: formData
        }
      );


    if (!response.ok) {

      let message =
        "Audio export failed";


      try {

        const data =
          await response.json();


        message =
          data.details
          || data.error
          || message;

      }

      catch {}


      throw new Error(
        message
      );

    }


    const exportBlob =
      await response.blob();


    const url =
      URL.createObjectURL(
        exportBlob
      );


    const link =
      document.createElement(
        "a"
      );


    const suffix =
      scope === "selection"
      ? "-selection"
      : "";


    link.href =
      url;


    link.download =
      track
      + suffix
      + "."
      + format;


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(
          url
        ),
      1000
    );


    status.textContent =
      "Export complete";

  }

  catch (error) {

    console.error(
      error
    );


    status.textContent =
      "Export error: "
      + error.message;

  }

}



// ========================================
// COMMON TIME
// ========================================

function getCurrentTime() {

  if (
    mode === "original"
  ) {

    return (
      originalAudio.currentTime
      ||
      0
    );

  }


  if (
    mode === "master"
  ) {

    return (
      masterAudio.currentTime
      ||
      0
    );

  }


  return (
    minusAudio.currentTime
    ||
    0
  );

}


function syncAllTo(
  time
) {

  const safeTime =
    Math.max(
      0,
      Math.min(
        time,
        duration || 0
      )
    );


  originalAudio.currentTime =
    safeTime;


  vocalsAudio.currentTime =
    safeTime;


  minusAudio.currentTime =
    safeTime;


  if (
    masterBlob
    &&
    Number.isFinite(
      masterAudio.duration
    )
  ) {

    masterAudio.currentTime =
      Math.max(
        0,
        Math.min(
          safeTime,
          masterAudio.duration || 0
        )
      );

  }

}


// ========================================
// WAVEFORM SEEK
// ========================================

Object.values(
  canvases
).forEach(
  canvas => {

    canvas.addEventListener(
      "pointerdown",
      event => {

        seekFromWaveform(
          canvas,
          event
        );

      }
    );

  }
);


function seekFromWaveform(
  canvas,
  event
) {

  if (!duration) {

    return;

  }


  const rect =
    canvas.getBoundingClientRect();


  const x =
    Math.max(
      0,
      Math.min(
        rect.width,
        event.clientX
        - rect.left
      )
    );


  const ratio =
    x
    / rect.width;


  const time =
    ratio
    * duration;


  syncAllTo(
    time
  );


  updatePlayheads();

  updateMasterCursor();

  updateTimeDisplay();

}




// ========================================
// TIMELINE SELECTION
// ========================================

masterTimelineInner.addEventListener(
  "pointerdown",
  event => {

    if (
      event.target === masterCursor
    ) {

      return;

    }


    selectionDragging =
      true;


    selectionMoved =
      false;


    const rect =
      masterTimelineInner
        .getBoundingClientRect();


    selectionPointerStartX =
      Math.max(
        0,
        Math.min(
          rect.width,
          event.clientX
          - rect.left
        )
      );


    masterTimelineInner
      .setPointerCapture(
        event.pointerId
      );


    event.preventDefault();

  }
);


masterTimelineInner.addEventListener(
  "pointermove",
  event => {

    if (!selectionDragging) {
      return;
    }


    const rect =
      masterTimelineInner
        .getBoundingClientRect();


    const x =
      Math.max(
        0,
        Math.min(
          rect.width,
          event.clientX
          - rect.left
        )
      );


    if (
      Math.abs(
        x - selectionPointerStartX
      )
      > 4
    ) {

      selectionMoved =
        true;

    }


    if (!selectionMoved) {
      return;
    }


    const startX =
      Math.min(
        selectionPointerStartX,
        x
      );


    const endX =
      Math.max(
        selectionPointerStartX,
        x
      );


    selectionStart =
      startX
      / rect.width
      * duration;


    selectionEnd =
      endX
      / rect.width
      * duration;


    updateSelectionDisplay();

  }
);


masterTimelineInner.addEventListener(
  "pointerup",
  event => {

    if (!selectionDragging) {
      return;
    }


    selectionDragging =
      false;


    if (
      masterTimelineInner
        .hasPointerCapture(
          event.pointerId
        )
    ) {

      masterTimelineInner
        .releasePointerCapture(
          event.pointerId
        );

    }


    if (!selectionMoved) {

      clearSelection();


      seekFromMasterTimeline(
        event
      );

    }


    updateSelectionButtons();

  }
);


function updateSelectionDisplay() {

  if (
    selectionStart === null
    ||
    selectionEnd === null
    ||
    selectionEnd <= selectionStart
  ) {

    selectionRange.style.display =
      "none";


    selectionInfo.textContent =
      "Selection: none";


    return;

  }


  const startX =
    selectionStart
    * pixelsPerSecond;


  const endX =
    selectionEnd
    * pixelsPerSecond;


  selectionRange.style.display =
    "block";


  selectionRange.style.left =
    startX + "px";


  selectionRange.style.width =
    Math.max(
      1,
      endX - startX
    )
    + "px";


  selectionInfo.textContent =
    "Selection: "
    + formatTime(
        selectionStart
      )
    + " — "
    + formatTime(
        selectionEnd
      );


  updateSelectionButtons();

}


function clearSelection() {

  selectionStart =
    null;


  selectionEnd =
    null;


  selectionRange.style.display =
    "none";


  selectionInfo.textContent =
    "Selection: none";


  updateSelectionButtons();

}


function hasSelection() {

  return (
    selectionStart !== null
    &&
    selectionEnd !== null
    &&
    selectionEnd > selectionStart
  );

}


function updateSelectionButtons() {

  const enabled =
    hasSelection();


  document
    .querySelectorAll(
      '[data-export-scope="selection"]'
    )
    .forEach(
      button => {

        button.disabled =
          !enabled;

      }
    );


  saveMasterSelectionBtn.disabled =
    !enabled
    ||
    !masterBlob;

}


// ========================================
// MASTER CURSOR DRAG
// ========================================

masterCursor.addEventListener(
  "pointerdown",
  event => {

    masterCursorDragging =
      true;


    masterCursor.setPointerCapture(
      event.pointerId
    );


    event.preventDefault();

  }
);


masterCursor.addEventListener(
  "pointermove",
  event => {

    if (
      !masterCursorDragging
    ) {

      return;

    }


    seekFromMasterTimeline(
      event
    );

  }
);


masterCursor.addEventListener(
  "pointerup",
  event => {

    masterCursorDragging =
      false;


    if (
      masterCursor.hasPointerCapture(
        event.pointerId
      )
    ) {

      masterCursor.releasePointerCapture(
        event.pointerId
      );

    }

  }
);


function seekFromMasterTimeline(
  event
) {

  if (!duration) {

    return;

  }


  const rect =
    masterTimelineInner
      .getBoundingClientRect();


  let x =
    event.clientX
    - rect.left;


  x =
    Math.max(
      0,
      Math.min(
        rect.width,
        x
      )
    );


  const ratio =
    x
    / rect.width;


  const time =
    ratio
    * duration;


  syncAllTo(
    time
  );


  updatePlayheads();

  updateMasterCursor();

  updateTimeDisplay();

}


// ========================================
// PLAYHEADS
// ========================================

function updatePlayheads() {

  if (!duration) {

    return;

  }


  const x =
    getCurrentTime()
    * pixelsPerSecond;


  Object.values(
    playheads
  )
  .forEach(
    playhead => {

      playhead.style.left =
        x
        + "px";

    }
  );

}


function updateMasterCursor() {

  if (!duration) {

    return;

  }


  const x =
    getCurrentTime()
    * pixelsPerSecond;


  masterCursor.style.left =
    x
    + "px";

}


// ========================================
// TIME DISPLAY
// ========================================

function formatTime(
  seconds
) {

  if (
    !Number.isFinite(
      seconds
    )
  ) {

    seconds =
      0;

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  const hundredths =
    Math.floor(
      (seconds % 1)
      * 100
    );


  return (
    String(minutes)
      .padStart(2, "0")

    + ":"

    + String(secs)
      .padStart(2, "0")

    + "."

    + String(hundredths)
      .padStart(2, "0")
  );

}


function formatShortTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  return (
    String(minutes)
      .padStart(2, "0")

    + ":"

    + String(secs)
      .padStart(2, "0")
  );

}


function updateTimeDisplay() {

  const current =
    getCurrentTime();


  const remaining =
    Math.max(
      0,
      duration - current
    );


  timeDisplay.textContent =

    formatTime(
      current
    )

    + " / "

    + formatTime(
      duration
    )

    + " / -"

    + formatTime(
      remaining
    );

}


// ========================================
// ANIMATION LOOP
// ========================================

function startAnimation() {

  stopAnimation();


  const update =
    () => {

      if (
        !isPlaying
      ) {

        return;

      }


      keepTracksSynchronized();

      updatePlayheads();

      updateMasterCursor();

      updateTimeDisplay();

      followPlayhead();


      if (
        (
          mode === "master"
          &&
          masterDuration > 0
          &&
          getCurrentTime()
          >= masterDuration
        )
        ||
        (
          mode !== "master"
          &&
          getCurrentTime()
          >= duration
        )
      ) {

        pauseAll();

        return;

      }


      animationFrame =
        requestAnimationFrame(
          update
        );

    };


  animationFrame =
    requestAnimationFrame(
      update
    );

}


function stopAnimation() {

  if (
    animationFrame
  ) {

    cancelAnimationFrame(
      animationFrame
    );


    animationFrame =
      null;

  }

}


// ========================================
// AUDIO SYNCHRONIZATION
// ========================================

function keepTracksSynchronized() {

  if (
    mode !== "mix"
  ) {

    return;

  }


  const reference =
    minusAudio.currentTime;


  if (
    Math.abs(
      vocalsAudio.currentTime
      - reference
    )
    > 0.08
  ) {

    vocalsAudio.currentTime =
      reference;

  }

}


// ========================================
// AUTO SCROLL
// ========================================

function followPlayhead() {

  const x =
    getCurrentTime()
    * pixelsPerSecond;


  const mainScroll =
    scrollAreas[0];


  const left =
    mainScroll.scrollLeft;


  const right =
    left
    +
    mainScroll.clientWidth;


  const margin =
    100;


  if (
    x
    >
    right - margin
  ) {

    syncScrollTo(

      x
      -
      mainScroll.clientWidth
      +
      margin

    );

  }

  else if (
    x
    <
    left + margin
  ) {

    syncScrollTo(

      Math.max(
        0,
        x - margin
      )

    );

  }

}


// ========================================
// SYNCHRONIZED SCROLL
// ========================================

scrollAreas.forEach(
  area => {

    area.addEventListener(
      "scroll",
      () => {

        if (
          scrollSyncLock
        ) {

          return;

        }


        scrollSyncLock =
          true;


        const left =
          area.scrollLeft;


        scrollAreas.forEach(
          other => {

            if (
              other !== area
            ) {

              other.scrollLeft =
                left;

            }

          }
        );


        masterTimeline.scrollLeft =
          left;


        scrollSyncLock =
          false;

      }
    );

  }
);


masterTimeline.addEventListener(
  "scroll",
  () => {

    if (
      scrollSyncLock
    ) {

      return;

    }


    scrollSyncLock =
      true;


    const left =
      masterTimeline.scrollLeft;


    scrollAreas.forEach(
      area => {

        area.scrollLeft =
          left;

      }
    );


    scrollSyncLock =
      false;

  }
);


function syncScrollTo(
  left
) {

  scrollSyncLock =
    true;


  scrollAreas.forEach(
    area => {

      area.scrollLeft =
        left;

    }
  );


  masterTimeline.scrollLeft =
    left;


  scrollSyncLock =
    false;

}


// ========================================
// ZOOM
// ========================================

zoomInBtn.addEventListener(

  () => {

    changeZoom(
      pixelsPerSecond + 10
    );

  }

zoomOutBtn.addEventListener(

function changeZoom(

) {

  const time =
    getCurrentTime();


  pixelsPerSecond =

      )

  updateSelectionDisplay();


  const left =
    Math.max(
      0,
      time
      * pixelsPerSecond
      - 150
    );


  syncScrollTo(
    left
  );

}


// ========================================
// RESET
// ========================================

function resetTransport() {

  pauseAll();

  syncAllTo(0);


  mode =
    "original";


  originalModeBtn.classList.add(
    "active"
  );


  mixModeBtn.classList.remove(

  );

}

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
