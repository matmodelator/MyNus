
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Создать минус</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background: #f3f3f3;
    }

    .app {
      width: 340px;

      padding: 30px;

      background: white;

      border-radius: 12px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      margin: 20px 0;
    }

    button {
      width: 100%;

      padding: 14px;

      border: 0;
      border-radius: 8px;

      background: #222;
      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      margin-top: 20px;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    #download {
      display: none;

      margin-top: 15px;

      color: #222;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Создать минус</h1>

  <input
    id="audioFile"
    type="file"
    accept="audio/*"
  >

  <button id="createBtn">
    Создать минус
  </button>

  <div id="status"></div>

  <audio
    id="player"
    controls
    style="display:none"
  ></audio>

  <a
    id="download"
    download="minus.mp3"
  >
    Скачать минус
  </a>

</div>


<script>

const fileInput = document.getElementById("audioFile");
const createBtn = document.getElementById("createBtn");
const status = document.getElementById("status");
const player = document.getElementById("player");
const download = document.getElementById("download");


createBtn.addEventListener("click", async () => {

  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Выберите песню";
    return;
  }


  const formData = new FormData();

  formData.append("audio", file);


  createBtn.disabled = true;

  status.textContent = "Обработка...";

  player.style.display = "none";
  download.style.display = "none";


  try {

    const response = await fetch("/separate", {
      method: "POST",
      body: formData
    });


    if (!response.ok) {
      throw new Error("Ошибка обработки");
    }


    const blob = await response.blob();

    const url = URL.createObjectURL(blob);


    player.src = url;
    player.style.display = "block";


    download.href = url;
    download.style.display = "inline-block";


    status.textContent = "Минус готов";

  }

  catch (error) {

    console.error(error);

    status.textContent = "Ошибка";

  }

  finally {

    createBtn.disabled = false;

  }

});

</script>



<!-- ========================================
     SERVICE CONSOLE
======================================== -->

<div id="service-console">
 GPT | 1.0.0
</div>

<div class="row" id="build-down">
deploy: --
</div>

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
