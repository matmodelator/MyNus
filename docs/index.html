<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ========================================
       BASIC SETTINGS
  ======================================== -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyNus — Split Song</title>


  <style>

    /* ========================================
       PAGE LAYOUT
    ======================================== */

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }


    /* ========================================
       APPLICATION
    ======================================== */

    .app {
      width: 360px;
      padding: 30px;

      background: white;
      border-radius: 12px;

      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 25px;

      text-align: center;
      font-size: 24px;
    }

    input {
      width: 100%;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;

      border: 0;
      border-radius: 8px;

      background: #222;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }


    /* ========================================
       STATUS AND PROCESS MARKER
    ======================================== */

    #status {
      margin-top: 20px;
      text-align: center;
    }

    .progress-wrap {
      display: none;

      width: 100%;
      height: 8px;

      margin-top: 16px;

      background: #e5e5e5;

      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      width: 35%;
      height: 100%;

      background: #222;
      border-radius: 4px;

      animation: processing 1.2s linear infinite;
    }

    @keyframes processing {

      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(300%);
      }

    }


    /* ========================================
       RESULTS
    ======================================== */

    .result {
      display: none;
      margin-top: 25px;
    }

    .track {
      margin-top: 20px;
    }

    .track-title {
      margin-bottom: 8px;
      font-weight: bold;
    }

    audio {
      width: 100%;
    }

    a {
      display: inline-block;
      margin-top: 8px;
      color: #222;
    }

  </style>

</head>


<body>


<!-- ========================================
     MAIN APPLICATION
======================================== -->

<div class="app">

  <h1>Split Song</h1>

  <input
    type="file"
    id="audioFile"
    accept="audio/*"
  >

  <button id="splitBtn">
    Split
  </button>

  <div id="status"></div>


  <!-- ========================================
       PROCESS MARKER
  ======================================== -->

  <div
    id="progressWrap"
    class="progress-wrap"
  >
    <div class="progress-bar"></div>
  </div>


  <!-- ========================================
       SEPARATION RESULTS
  ======================================== -->

  <div
    id="result"
    class="result"
  >

    <div class="track">

      <div class="track-title">
        Vocals
      </div>

      <audio
        id="vocalsPlayer"
        controls
      ></audio>

      <br>

      <a
        id="vocalsDownload"
        download="vocals.mp3"
      >
        Download Vocals
      </a>

    </div>


    <div class="track">

      <div class="track-title">
        Instrumental
      </div>

      <audio
        id="minusPlayer"
        controls
      ></audio>

      <br>

      <a
        id="minusDownload"
        download="instrumental.mp3"
      >
        Download Instrumental
      </a>

    </div>

  </div>

</div>


<script>


// ========================================
// PAGE ELEMENTS
// ========================================

const audioFile = document.getElementById("audioFile");
const splitBtn = document.getElementById("splitBtn");

const status = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const result = document.getElementById("result");

const vocalsPlayer = document.getElementById("vocalsPlayer");
const minusPlayer = document.getElementById("minusPlayer");

const vocalsDownload = document.getElementById("vocalsDownload");
const minusDownload = document.getElementById("minusDownload");


// ========================================
// AUDIO SEPARATION
// ========================================

splitBtn.addEventListener("click", async () => {

  const file = audioFile.files[0];

  if (!file) {
    status.textContent = "Select an audio file";
    return;
  }


  const formData = new FormData();

  formData.append("audio", file);


  splitBtn.disabled = true;

  status.textContent = "Separating...";

  result.style.display = "none";
  progressWrap.style.display = "block";


  try {

    const response = await fetch("/separate", {
      method: "POST",
      body: formData
    });


    if (!response.ok) {
      throw new Error("Server error");
    }


    const data = await response.json();


    vocalsPlayer.src = data.vocals;
    minusPlayer.src = data.minus;

    vocalsDownload.href = data.vocals;
    minusDownload.href = data.minus;


    result.style.display = "block";

    status.textContent = "Done";

  }

  catch (error) {

    console.error(error);

    status.textContent = "Processing error";

  }

  finally {

    progressWrap.style.display = "none";

    splitBtn.disabled = false;

  }

});


</script>




<!-- ========================================
     SERVICE CONSOLE
======================================== -->

<div id="service-console">
 Маркер процесса\комменты\англ | 1.1.0
</div>

<div class="row" id="build-down">
deploy: --
</div>

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
