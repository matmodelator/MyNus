<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Разделение песни</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    .app {
      width: 360px;
      padding: 30px;

      background: white;
      border-radius: 12px;

      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 25px;
      text-align: center;
      font-size: 24px;
    }

    input {
      width: 100%;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;

      border: 0;
      border-radius: 8px;

      background: #222;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    #status {
      margin-top: 20px;
      text-align: center;
    }

    .result {
      display: none;
      margin-top: 25px;
    }

    .track {
      margin-top: 20px;
    }

    .track-title {
      margin-bottom: 8px;
      font-weight: bold;
    }

    audio {
      width: 100%;
    }

    a {
      display: inline-block;
      margin-top: 8px;
      color: #222;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Разделить песню</h1>

  <input
    type="file"
    id="audioFile"
    accept="audio/*"
  >

  <button id="splitBtn">
    Разделить
  </button>

  <div id="status"></div>


  <div id="result" class="result">

    <div class="track">
      <div class="track-title">
        Вокал
      </div>

      <audio
        id="vocalsPlayer"
        controls
      ></audio>

      <br>

      <a
        id="vocalsDownload"
        download="vocals.mp3"
      >
        Скачать вокал
      </a>
    </div>


    <div class="track">
      <div class="track-title">
        Минус
      </div>

      <audio
        id="minusPlayer"
        controls
      ></audio>

      <br>

      <a
        id="minusDownload"
        download="minus.mp3"
      >
        Скачать минус
      </a>
    </div>

  </div>

</div>


<script>

const audioFile = document.getElementById("audioFile");
const splitBtn = document.getElementById("splitBtn");

const status = document.getElementById("status");
const result = document.getElementById("result");

const vocalsPlayer = document.getElementById("vocalsPlayer");
const minusPlayer = document.getElementById("minusPlayer");

const vocalsDownload = document.getElementById("vocalsDownload");
const minusDownload = document.getElementById("minusDownload");


splitBtn.addEventListener("click", async () => {

  const file = audioFile.files[0];

  if (!file) {
    status.textContent = "Выберите аудиофайл";
    return;
  }


  const formData = new FormData();

  formData.append("audio", file);


  splitBtn.disabled = true;

  status.textContent = "Разделение...";
  result.style.display = "none";


  try {

    const response = await fetch("/separate", {
      method: "POST",
      body: formData
    });


    if (!response.ok) {
      throw new Error("Ошибка сервера");
    }


    const data = await response.json();


    vocalsPlayer.src = data.vocals;
    minusPlayer.src = data.minus;


    vocalsDownload.href = data.vocals;
    minusDownload.href = data.minus;


    result.style.display = "block";

    status.textContent = "Готово";

  }

  catch (error) {

    console.error(error);

    status.textContent = "Ошибка обработки";

  }

  finally {

    splitBtn.disabled = false;

  }

});

</script>



<!-- ========================================
     SERVICE CONSOLE
======================================== -->

<div id="service-console">
 GPT | 1.0.0
</div>

<div class="row" id="build-down">
deploy: --
</div>

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
